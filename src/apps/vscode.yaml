name: Visual Studio Code
id: vscode
homepage: https://code.visualstudio.com/

download:
  url: https://code.visualstudio.com/sha/download?build=stable&os=win32-x64
  checksum: ""
  mirrors: []

install:
  type: exe
  silent_args: /VERYSILENT /MERGETASKS=!runcode
  pre_install:
    kill_processes:
      - Code.exe
  post_install:
    create_shortcuts: []

detection:
  method: both
  registry:
    - path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{EA457B21-F73E-494C-ACAB-524FDE069978}_is1
      value: DisplayVersion
    - path: HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{771FD6B0-FA20-440A-A002-3B3BAC16DC50}_is1
      value: DisplayVersion
  file:
    - path: C:\Program Files\Microsoft VS Code\Code.exe

metadata:
  description: Code editing redefined - Free source code editor
  publisher: Microsoft Corporation
  category: Development
  license: MIT
  tags:
    - ide
    - editor
    - development
