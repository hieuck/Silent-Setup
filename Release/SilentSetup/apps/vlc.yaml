name: VLC Media Player
id: vlc
homepage: https://www.videolan.org/vlc/

download:
  url: https://get.videolan.org/vlc/last/win64/vlc-3.0.20-win64.exe

install:
  type: exe
  silent_args: /L=1033 /S
  timeout: 300

detection:
  method: both
  registry:
    - path: HKLM\SOFTWARE\VideoLAN\VLC
  file:
    - path: C:\Program Files\VideoLAN\VLC\vlc.exe

metadata:
  category: Media
  publisher: VideoLAN
  license: GPL-2.0
  description: Trình phát đa phương tiện mã nguồn mở, hỗ trợ mọi định dạng
  tags:
    - video
    - media
    - player
