name: WinRAR Tiếng Việt
id: winrar-vietnamese
target_app: winrar
type: copy-files

files:
  - name: winrar_vi.lng
    destination: '{app_dir}\winrar_vi.lng'
  - name: rarreg.key
    destination: '{app_dir}\rarreg.key'

registry:
  - action: set
    root: HKCU
    path: Software\WinRAR\Interface
    name: Language
    value: Vietnamese
    type: string

metadata:
  category: Localization
  author: Silent Setup
  version: 7.01
  description: Gói ngôn ngữ tiếng Việt cho WinRAR

notes: |
  Patch này cài đặt giao diện tiếng Việt cho WinRAR và tự động kích hoạt license (nếu có).

  Cách sử dụng:
  1. Cài đặt WinRAR trước
  2. Chọn patch "WinRAR Tiếng Việt"
  3. Khởi động lại WinRAR để thấy giao diện tiếng Việt

  File cần thiết trong thư mục files/:
  - winrar_vi.lng (BẮT BUỘC) - File ngôn ngữ tiếng Việt
  - rarreg.key (TÙY CHỌN) - File license nếu bạn đã mua

  Download file ngôn ngữ từ:
  https://www.win-rar.com/downld.html?&L=9
  (Chọn "Vietnamese" trong mục Language files)

  License:
  - Nếu có file rarreg.key, WinRAR sẽ được kích hoạt tự động
  - Nếu không có, WinRAR hoạt động ở chế độ trial 40 ngày
  - Không chia sẻ file license (vi phạm bản quyền)
  - Mua license tại: https://www.win-rar.com/buy-winrar.html
