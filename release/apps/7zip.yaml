name: 7-Zip
id: 7zip
homepage: https://www.7-zip.org/

download:
  url: https://www.7-zip.org/a/7z2408-x64.exe
  checksum: ""
  mirrors: []

install:
  type: exe
  silent_args: /S
  pre_install:
    kill_processes:
      - 7zFM.exe
      - 7zG.exe
  post_install:
    create_shortcuts: []

detection:
  method: both
  registry:
    - key: HKLM\SOFTWARE\7-Zip
      value: Path
  file:
    path: C:\Program Files\7-Zip\7z.exe
    version_check: true

metadata:
  description: High compression ratio file archiver
  publisher: Igor Pavlov
  category: Utility
  license: LGPL
  tags:
    - compression
    - archiver
    - utility
