name: 7-Zip
id: 7zip
homepage: https://www.7-zip.org/

download:
  url: https://www.7-zip.org/a/7z2408-x64.exe

install:
  type: exe
  silent_args: /S
  timeout: 180

detection:
  method: both
  registry:
    - path: HKLM\SOFTWARE\7-Zip
  file:
    - path: C:\Program Files\7-Zip\7zFM.exe

metadata:
  category: Utility
  publisher: Igor Pavlov
  license: LGPL
  description: Phần mềm nén và giải nén file miễn phí với tỷ lệ nén cao
  tags:
    - compression
    - archiver
    - zip
