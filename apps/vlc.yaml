name: VLC Media Player
id: vlc
homepage: https://www.videolan.org/vlc/

download:
  url: https://get.videolan.org/vlc/last/win64/vlc-3.0.21-win64.exe
  checksum: ""
  mirrors:
    - https://mirrors.netix.net/vlc/vlc/last/win64/vlc-3.0.21-win64.exe

install:
  type: exe
  silent_args: /S
  pre_install:
    kill_processes:
      - vlc.exe
  post_install:
    create_shortcuts: []

detection:
  method: both
  registry:
    - key: HKLM\SOFTWARE\VideoLAN\VLC
      value: Version
  file:
    path: C:\Program Files\VideoLAN\VLC\vlc.exe
    version_check: true

metadata:
  description: Free and open source cross-platform multimedia player
  publisher: VideoLAN
  category: Media
  license: GPL-2.0
  tags:
    - media
    - player
    - video
