name: Google Chrome
id: chrome
homepage: https://www.google.com/chrome/

download:
  url: https://dl.google.com/chrome/install/latest/chrome_installer.exe
  checksum: ""
  mirrors: []

install:
  type: exe
  silent_args: /silent /install
  pre_install:
    kill_processes:
      - chrome.exe
  post_install:
    create_shortcuts: []

detection:
  method: both
  registry:
    - key: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Google Chrome
      value: DisplayVersion
  file:
    path: C:\Program Files\Google\Chrome\Application\chrome.exe
    version_check: true

metadata:
  description: Fast, secure browser from Google
  publisher: Google LLC
  category: Browser
  license: Freeware
  tags:
    - browser
    - google
